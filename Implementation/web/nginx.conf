server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64m;

  location /api/owner/ {
    proxy_pass http://owner:4000/;
    proxy_read_timeout 900s;
  }
  location /api/cloud/ {
    proxy_pass http://cloud:5000/;
    proxy_read_timeout 900s;
  }
  location / {
    try_files $uri /index.html;
  }
}
