server {
  listen 80;
  root /usr/share/nginx/html;
  client_max_body_size 64m;

  location /api/owner/ {
    proxy_pass http://owner:4000/;
    proxy_read_timeout 900s;
  }
  location /api/cloud/ {
    proxy_pass http://cloud:5000/;
    proxy_read_timeout 900s;
  }
  # Hashed by Vite: cache forever, and a stale name must 404 rather than get index.html.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
  # index.html names the current assets, so always revalidate it after a rebuild.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
